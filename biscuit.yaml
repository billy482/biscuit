---
backup:
  block_size: 4096
  checksum: sha1
  strategy: timestamp
database:
  driver: sqlite
  path: backup/files.db
key:
  path: key
log:
  levels:
    core: debug
    database: debug
    ssh: debug
  path: backup/backup.log
sources:
  /build/:
    include_patterns:
      - '*.cpp'
      - '*.hpp'
    exclude:
      - /build
    exclude_patterns:
      - '.*.sw?'
    options:
      exclude_other_filesystem: false
      exclude_if_present:
        - .no_backup
    sub_directories:
      'foo/bar':
        include_patterns:
          - '*.hpp'
