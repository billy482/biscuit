backup:
  block_size: 4096
  checksum: sha1
  options:
    exclude: []
    exclude_if_present:
    - .no_backup
    exclude_other_filesystem: true
  sources:
  - driver: file
    path: biscuit
    options:
      exclude:
      - '*.pyc'
      exclude_if_present: []
      exclude_other_filesystem: false
  strategy: timestamp
database:
  driver: sqlite
  path: biscuit.db
key:
  cipher: AES256-GCM
  path: ~/.biscuit/key
log:
  levels:
    core: debug
    database: debug
    keyring: debug
    ssh: debug
  path: backup.log
