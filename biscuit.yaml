---
backup:
  block_size: 4096
  checksum: sha1
  options:
    exclude_if_present:
      - .no_backup
    exclude_other_filesystem: true
  sources:
    - driver: file
      options:
        exclude:
          - '*.pyc'
      path: biscuit
  strategy: timestamp
database:
  driver: sqlite
  path: biscuit.db
key:
  algo: AES256
  mode: CBC
  padding: PKCS7
  path: key
log:
  levels:
    core: debug
    database: debug
    keyring: debug
    ssh: debug
  path: backup.log
